name: Mirror and compress card databases

on:
  schedule:
    # Every 2 hours — keeps client cdb staleness within the <=2h SLA when moecube
    # publishes updates. The job commits only on content change, so most runs are no-ops.
    # genesys.yml stays daily on purpose: its source updates on an editorial schedule.
    - cron: "0 */2 * * *"
  push:
    paths:
      - "cdb/*.cdb"
  workflow_dispatch: {}

permissions:
  contents: write

# Serialize with the genesys workflow: both commit version-manifest.json, so running
# them concurrently would race on that file. A shared group makes the second one wait.
concurrency:
  group: version-manifest
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Mirror moecube base databases
        # -D dumps the response headers (across redirects) so the manifest step can read
        # the upstream Last-Modified without a second request.
        run: |
          set -euo pipefail
          curl -sSL --fail --max-time 300 -D /tmp/base.en.headers \
            "https://cdntx.moecube.com/ygopro-database/en-US/cards.cdb" -o /tmp/base.en.cdb
          curl -sSL --fail --max-time 300 -D /tmp/base.es.headers \
            "https://cdntx.moecube.com/ygopro-database/es-ES/cards.cdb" -o /tmp/base.es.cdb

      - name: Validate SQLite magic bytes
        # Never commit an upstream error page or truncated file as a database.
        run: |
          set -euo pipefail
          for f in /tmp/base.en.cdb /tmp/base.es.cdb; do
            head -c 15 "$f" | grep -q "SQLite format 3" || { echo "Invalid SQLite file: $f"; exit 1; }
          done

      - name: Compress databases (deterministic gzip)
        # -n omits the embedded mtime so identical inputs produce identical
        # bytes — otherwise every run would create a spurious commit.
        run: |
          set -euo pipefail
          gzip -9 -n -c /tmp/base.en.cdb > cdb/base.en.cdb.gz
          gzip -9 -n -c /tmp/base.es.cdb > cdb/base.es.cdb.gz
          for f in cdb/*.cdb; do
            gzip -9 -n -c "$f" > "$f.gz"
          done

      - name: Build version manifest
        # Records sha256 + freshness for each published asset so clients can check for
        # updates cheaply. Skips rewriting the file when only timestamps would change.
        run: |
          set -euo pipefail
          # `|| true` so a missing Last-Modified header degrades to an empty value
          # (the script maps empty → null) instead of aborting the whole mirror.
          en_lm=$(grep -i '^last-modified:' /tmp/base.en.headers | tail -1 | sed 's/^[^:]*:[[:space:]]*//I' | tr -d '\r' || true)
          es_lm=$(grep -i '^last-modified:' /tmp/base.es.headers | tail -1 | sed 's/^[^:]*:[[:space:]]*//I' | tr -d '\r' || true)
          MOECUBE_EN_LAST_MODIFIED="$en_lm" MOECUBE_ES_LAST_MODIFIED="$es_lm" \
            node scripts/build-version-manifest.mjs

      - name: Commit if any database or the manifest changed
        run: |
          if [ -n "$(git status --porcelain cdb version-manifest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cdb version-manifest.json
            git commit -m "chore(cdb): refresh mirrored databases and version manifest"
            # Another workflow (genesys) may have pushed the manifest meanwhile.
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "No database or manifest changes."
          fi
