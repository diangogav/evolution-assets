name: Mirror and translate Rush Duel pack

# The Rush pack lives on code.moenext.com, a third-party GitLab that has
# rate-limited us before. The duel server's Docker build runs
# clone_repositories.sh under `set -e`, so sourcing Rush from there directly
# means one unreachable upstream fails the whole image build — for a format
# most rooms never use.
#
# Mirroring turns that build-time dependency into a background sync: if moenext
# is down, this workflow fails and nobody notices until the next card set. The
# build only ever talks to GitHub, which it already depends on.

on:
  schedule:
    # Daily at 06:00 UTC. Upstream commits card fixes most days, so the mirror
    # is usually a no-op; only real changes produce a commit.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Serialize with the other workflows that commit to this repo.
concurrency:
  group: version-manifest
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history so the manifest's commit date reflects the real last edit.
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Clone the upstream pack
        run: |
          set -euo pipefail
          rm -rf /tmp/rush-src
          git clone --depth=1 --single-branch --branch master \
            https://code.moenext.com/mycard/ygopro-rush-duel.git /tmp/rush-src

      - name: Check the pack is intact before replacing ours
        # A partial or reorganised upstream must not silently empty the mirror:
        # the duel server reads these cdbs as its whole Rush card pool, and an
        # empty pool boots rooms with no cards at all.
        run: |
          set -euo pipefail
          test -f "/tmp/rush-src/RD Standard.cdb" || { echo "RD Standard.cdb missing upstream"; exit 1; }
          test -f /tmp/rush-src/lflist.conf       || { echo "lflist.conf missing upstream"; exit 1; }
          test -f /tmp/rush-src/sets.md           || { echo "sets.md missing upstream"; exit 1; }
          test -d /tmp/rush-src/script            || { echo "script/ missing upstream"; exit 1; }

          # sets.md maps each card-id block to its printed set (120281XXX -> RD/JF25).
          # It is the only route from a ygopro id to a card's identity outside this
          # pack, and moenext rate-limits us, so it has to come down with the clone
          # rather than be fetched when something needs it.
          grep -qE '`120[0-9]{3}XXX`' /tmp/rush-src/sets.md \
            || { echo "sets.md carries no id-block mappings"; exit 1; }

          head -c 15 "/tmp/rush-src/RD Standard.cdb" | grep -q "SQLite format 3" \
            || { echo "RD Standard.cdb is not a SQLite database"; exit 1; }

          # The pack carries a few thousand card scripts; a couple of dozen means
          # the clone truncated or upstream moved things.
          scripts=$(find /tmp/rush-src/script -name '*.lua' | wc -l)
          echo "upstream card scripts: $scripts"
          [ "$scripts" -ge 2000 ] || { echo "only $scripts scripts — refusing to mirror"; exit 1; }

          # RDRule.lua carries the field mask, draw rule and phase skips. Without
          # it the pack loads and every Rush duel plays by OCG rules instead.
          test -f /tmp/rush-src/script/RDRule.lua || { echo "RDRule.lua missing"; exit 1; }

      - name: Replace the mirrored copy
        run: |
          set -euo pipefail
          # Remove only the mirrored entries: script/, the cdbs, lflist.conf and
          # sets.md are upstream's to replace, but rush/pages.json and
          # rush/translations.json are our incremental caches and must survive
          # the refresh.
          rm -rf rush/script rush/*.cdb rush/lflist.conf rush/sets.md
          mkdir -p rush
          cp -r /tmp/rush-src/script rush/script
          cp /tmp/rush-src/*.cdb rush/
          cp /tmp/rush-src/lflist.conf rush/
          cp /tmp/rush-src/sets.md rush/
          # Everything else upstream ships (CI config, packaging scripts, its own
          # README) is theirs, not ours to carry.

      - name: Commit if the pack changed
        run: |
          if [ -n "$(git status --porcelain rush)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rush
            git commit -m "chore(rush): refresh mirrored Rush Duel script pack"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "No Rush pack changes."
          fi

      # The translation pipeline runs on every daily pass, after the mirror
      # commit has already landed: each script is incremental and idempotent
      # (a no-op when nothing changed), and a wiki/network failure here must
      # fail the run loudly without undoing the mirror refresh above.
      - name: Resolve wiki pages for new card ids
        run: node scripts/fetch-rush-code-pages.mjs

      - name: Fetch translations for new pages
        run: node scripts/fetch-rush-translations.mjs

      - name: Build unified Rush databases
        run: node scripts/build-rush-cdb.mjs

      - name: Update version manifest
        run: node scripts/update-rush-manifest.mjs

      - name: Commit if the translated databases changed
        run: |
          paths="rush/pages.json rush/translations.json cdb/rush.cdb.gz cdb/rush.en.cdb.gz cdb/rush.es.cdb.gz version-manifest.json"
          if [ -n "$(git status --porcelain $paths)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add $paths
            git commit -m "chore(rush): refresh translated databases"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "No translated database changes."
          fi
