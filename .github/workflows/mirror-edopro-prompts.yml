name: Mirror EDOPro prompt strings

on:
  schedule:
    # Daily at 08:15 UTC, clear of the other mirrors. Only commits when the
    # built files actually change.
    - cron: "15 8 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Serialize with the other workflows that commit version-manifest.json.
concurrency:
  group: version-manifest
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history so the manifest's commit date reflects the real last edit.
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Clone the EDOPro card databases
        # The same repository and branch the server loads its EDOPro databases
        # from, so what is built here follows what its rooms run.
        run: |
          set -euo pipefail
          rm -rf /tmp/babelcdb
          git clone --depth=1 --single-branch --branch master \
            https://github.com/ProjectIgnis/BabelCDB.git /tmp/babelcdb

      - name: Build the prompts database
        run: |
          set -euo pipefail
          node scripts/build-edopro-prompts.mjs --databases /tmp/babelcdb --out /tmp/prompts.cdb
          # Fail loudly if the build produced a non-SQLite file.
          head -c 15 /tmp/prompts.cdb | grep -q "SQLite format 3" || { echo "built file is not a SQLite db"; exit 1; }
          cp /tmp/prompts.cdb edopro/prompts.cdb
          # -n omits the mtime so identical content produces identical bytes.
          gzip -9 -n -c /tmp/prompts.cdb > edopro/prompts.cdb.gz

      - name: Build the database of the cards the client lacks
        # Subtracts the client's base database, so this follows both upstreams.
        run: |
          set -euo pipefail
          node scripts/build-edopro-cards.mjs --databases /tmp/babelcdb --known cdb/base.en.cdb.gz --out /tmp/cards.cdb
          head -c 15 /tmp/cards.cdb | grep -q "SQLite format 3" || { echo "built file is not a SQLite db"; exit 1; }
          cp /tmp/cards.cdb edopro/cards.cdb
          gzip -9 -n -c /tmp/cards.cdb > edopro/cards.cdb.gz

      - name: Pair the unreleased cards of both card pools
        # An unreleased card has one temporary code here and another in EDOPro.
        run: |
          set -euo pipefail
          node scripts/build-edopro-prerelease-ids.mjs --databases /tmp/babelcdb --prerelease cdb/prerelease.en.cdb.gz --out /tmp/prerelease-ids.json
          node -e 'const m = JSON.parse(require("fs").readFileSync("/tmp/prerelease-ids.json", "utf8")); if (m.version !== 1 || typeof m.ids !== "object") process.exit(1)'
          cp /tmp/prerelease-ids.json edopro/prerelease-ids.json

      - name: Map the codes only EDOPro uses to the client's own
        # A deck built in EDOPro holds them; the client converts it with this.
        run: |
          set -euo pipefail
          node scripts/build-edopro-deck-ids.mjs --databases /tmp/babelcdb --base cdb/base.en.cdb.gz --prerelease cdb/prerelease.en.cdb.gz --out /tmp/deck-ids.json
          node -e 'const m = JSON.parse(require("fs").readFileSync("/tmp/deck-ids.json", "utf8")); if (m.version !== 1 || typeof m.ids !== "object") process.exit(1)'
          cp /tmp/deck-ids.json edopro/deck-ids.json

      - name: Fetch EDOPro's strings.conf files
        # A file that fails to download, or comes back without a single system
        # string, is left as it is and the run is failed at the end.
        #
        # EDOPro's Spanish file leaves many entries untranslated, so its gaps
        # are filled from a community translation. The Spanish file is only
        # replaced when both downloads succeed: publishing the base alone
        # would drop every filled entry back to English.
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/ProjectIgnis/Distribution/master/config"
          fill="https://raw.githubusercontent.com/josevdr95new/cdbespa-alternativo/main/strings.conf"
          missing=""
          fetch() {
            curl -sSL --fail --max-time 120 "$2" -o "/tmp/strings.$1.conf" \
              && grep -q '^!system ' "/tmp/strings.$1.conf"
          }
          if fetch en "${base}/strings.conf"; then
            cp /tmp/strings.en.conf edopro/strings.en.conf
          else
            echo "::warning::EDOPro strings.conf (en) unavailable — keeping the current file"
            missing="${missing} en"
          fi
          if fetch es "${base}/languages/Espa%C3%B1ol/strings.conf" && fetch es-fill "${fill}"; then
            node scripts/fill-edopro-strings.mjs --base /tmp/strings.es.conf --fill /tmp/strings.es-fill.conf \
              --reference edopro/strings.en.conf --out edopro/strings.es.conf
          else
            echo "::warning::EDOPro strings.conf (es) or its fill unavailable — keeping the current file"
            missing="${missing} es"
          fi
          echo "MISSING_STRINGS=${missing# }" >> "$GITHUB_ENV"

      - name: Update version manifest
        # Run here: a push made with GITHUB_TOKEN never triggers
        # repo-assets-manifest.yml, so its `paths:` filter would not pick this up.
        run: node scripts/update-repo-assets-manifest.mjs

      - name: Commit if the mirrored files changed
        run: |
          if [ -n "$(git status --porcelain edopro version-manifest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add edopro version-manifest.json
            git commit -m "chore(edopro): refresh prompt strings, cards and prerelease ids"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "No changes."
          fi

      - name: Fail if a strings file was skipped
        if: env.MISSING_STRINGS != ''
        run: |
          echo "::error::EDOPro strings.conf not refreshed for: ${MISSING_STRINGS}"
          exit 1
