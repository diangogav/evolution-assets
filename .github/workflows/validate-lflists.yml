name: Validate hand-maintained lflists

on:
  push:
    paths:
      - "lflist/*.conf"
      - "scripts/validate-lflist.mjs"
      - "scripts/validate-lflist.test.mjs"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run script tests
        run: npm test

      - name: Validate edison, jtp and tcg lflists
        run: node scripts/validate-lflist.mjs
