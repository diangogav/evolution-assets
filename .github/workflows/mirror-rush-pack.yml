name: Mirror and translate Rush Duel pack

# The Rush pack lives on code.moenext.com, a third-party GitLab that has
# rate-limited us before. The duel server's Docker build runs
# clone_repositories.sh under `set -e`, so sourcing Rush from there directly
# means one unreachable upstream fails the whole image build — for a format
# most rooms never use.
#
# Mirroring turns that build-time dependency into a background sync: if moenext
# is down, this workflow fails and nobody notices until the next card set. The
# build only ever talks to GitHub, which it already depends on.

on:
  schedule:
    # Daily at 06:00 UTC. Upstream commits card fixes most days, so the mirror
    # is usually a no-op; only real changes produce a commit.
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Serialize with the other workflows that commit to this repo.
concurrency:
  group: version-manifest
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # Full history so the manifest's commit date reflects the real last edit.
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Clone the upstream pack
        run: |
          set -euo pipefail
          rm -rf /tmp/rush-src
          git clone --depth=1 --single-branch --branch master \
            https://code.moenext.com/mycard/ygopro-rush-duel.git /tmp/rush-src

      - name: Check the pack is intact before replacing ours
        # A partial or reorganised upstream must not silently empty the mirror:
        # the duel server reads these cdbs as its whole Rush card pool, and an
        # empty pool boots rooms with no cards at all.
        run: |
          set -euo pipefail
          test -f "/tmp/rush-src/RD Standard.cdb" || { echo "RD Standard.cdb missing upstream"; exit 1; }
          test -f /tmp/rush-src/lflist.conf       || { echo "lflist.conf missing upstream"; exit 1; }
          test -f /tmp/rush-src/sets.md           || { echo "sets.md missing upstream"; exit 1; }
          test -d /tmp/rush-src/script            || { echo "script/ missing upstream"; exit 1; }

          # sets.md maps each card-id block to its printed set (120281XXX -> RD/JF25).
          # It is the only route from a ygopro id to a card's identity outside this
          # pack, and moenext rate-limits us, so it has to come down with the clone
          # rather than be fetched when something needs it.
          grep -qE '`120[0-9]{3}XXX`' /tmp/rush-src/sets.md \
            || { echo "sets.md carries no id-block mappings"; exit 1; }

          head -c 15 "/tmp/rush-src/RD Standard.cdb" | grep -q "SQLite format 3" \
            || { echo "RD Standard.cdb is not a SQLite database"; exit 1; }

          # The pack carries a few thousand card scripts; a couple of dozen means
          # the clone truncated or upstream moved things.
          scripts=$(find /tmp/rush-src/script -name '*.lua' | wc -l)
          echo "upstream card scripts: $scripts"
          [ "$scripts" -ge 2000 ] || { echo "only $scripts scripts — refusing to mirror"; exit 1; }

          # RDRule.lua carries the field mask, draw rule and phase skips. Without
          # it the pack loads and every Rush duel plays by OCG rules instead.
          test -f /tmp/rush-src/script/RDRule.lua || { echo "RDRule.lua missing"; exit 1; }

      - name: Snapshot the card ids before the mirror refresh
        # The run report diffs new cards against this dump: by the time the
        # composer runs, the refresh below has already replaced the cdbs.
        run: |
          set -euo pipefail
          : > "$RUNNER_TEMP/old-ids.txt"
          for cdb in "rush/RD Standard.cdb" "rush/RD Patch.cdb" "rush/RD Alternate.cdb"; do
            if [ -f "$cdb" ]; then
              sqlite3 "$cdb" "SELECT id FROM datas;" >> "$RUNNER_TEMP/old-ids.txt"
            fi
          done
          sort -u -o "$RUNNER_TEMP/old-ids.txt" "$RUNNER_TEMP/old-ids.txt"

      - name: Replace the mirrored copy
        run: |
          set -euo pipefail
          # Remove only the mirrored entries: script/, the three mycard cdbs,
          # mycard's ban list and sets.md are upstream's to replace, but
          # rush/pages.json, rush/translations.json, rush/mdpro4/ and the
          # generated rush/RD MDPro4 Alternate.cdb are ours and must survive
          # the refresh. The cdbs are therefore named, not globbed.
          rm -rf rush/script "rush/RD Standard.cdb" "rush/RD Patch.cdb" "rush/RD Alternate.cdb" \
            rush/lflist.mycard.conf rush/sets.md
          mkdir -p rush
          cp -r /tmp/rush-src/script rush/script
          cp /tmp/rush-src/*.cdb rush/
          # mycard's ban list is kept under its own name: rush/lflist.conf is
          # built below from the official regulation plus this file's Legend
          # lines, and those lines must still be at hand on a run where only
          # the regulation moved.
          cp /tmp/rush-src/lflist.conf rush/lflist.mycard.conf
          cp /tmp/rush-src/sets.md rush/
          # Everything else upstream ships (CI config, packaging scripts, its own
          # README) is theirs, not ours to carry.

      - name: Regenerate the alternate-art script stubs
        # The refresh above deleted rush/script wholesale, stubs included. They
        # are rebuilt from the committed rush/RD MDPro4 Alternate.cdb before the
        # mirror commit so that commit never records their removal.
        run: node scripts/build-rush-alternate-scripts.mjs

      - name: Commit if the pack changed
        run: |
          if [ -n "$(git status --porcelain rush)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rush
            git commit -m "chore(rush): refresh mirrored Rush Duel script pack"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "No Rush pack changes."
          fi

      # ElderLich/MDPro4_Data supplies the complete en/es card texts, the
      # alternate-art rows and the official Rush regulation the fused outputs
      # are built from. It is mirrored after the mycard commit so a refused
      # snapshot never holds back mycard's own refresh.
      #
      # These steps run with continue-on-error: when MDPro4 is unreachable or
      # its snapshot is refused, everything below still runs on the copy
      # already committed under rush/mdpro4/, and the last step of the job
      # fails the run so the refusal is not missed.
      - name: Clone the MDPro4 data
        id: mdpro4_clone
        continue-on-error: true
        # The repository ships hundreds of MB of card art and packs; a sparse,
        # blobless clone fetches only the three files the fusion reads.
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/mdpro4-src"
          rm -rf "$src"
          git clone --depth=1 --single-branch --branch main --filter=blob:none --sparse \
            https://github.com/ElderLich/MDPro4_Data.git "$src"
          git -C "$src" sparse-checkout set --no-cone \
            /Data/locales/en-US/rush_cards.cdb \
            /Data/locales/es-ES/rush_cards.cdb \
            /Data/Banlists/Rush_lflist.conf

      - name: Check the MDPro4 data before replacing ours
        id: mdpro4_check
        continue-on-error: true
        # Refuses a non-SQLite file, a shrunken table, a malformed regulation
        # and any card whose mechanics differ from mycard's for the same id.
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/mdpro4-src"
          node scripts/check-mdpro4-data.mjs "$src/Data" "$(git -C "$src" rev-parse HEAD)"
        env:
          REPORT_PATH: ${{ runner.temp }}/report/check-mdpro4.json

      - name: Replace the mirrored MDPro4 data
        if: steps.mdpro4_check.outcome == 'success'
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/mdpro4-src"
          mkdir -p rush/mdpro4
          cp "$src/Data/locales/en-US/rush_cards.cdb" rush/mdpro4/rush_cards.en.cdb
          cp "$src/Data/locales/es-ES/rush_cards.cdb" rush/mdpro4/rush_cards.es.cdb
          cp "$src/Data/Banlists/Rush_lflist.conf" rush/mdpro4/Rush_lflist.conf
          git -C "$src" rev-parse HEAD > rush/mdpro4/SOURCE_COMMIT

      - name: Commit if the MDPro4 data changed
        if: steps.mdpro4_check.outcome == 'success'
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain rush/mdpro4)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rush/mdpro4
            git commit -m "chore(rush): refresh mirrored MDPro4 data"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "No MDPro4 data changes."
          fi

      # Built here rather than after the translation pipeline so a wiki outage
      # never holds back a regulation change. The ids are checked against the
      # fused card pool derived from the same inputs build-rush-cdb.mjs reads;
      # a missing id leaves the committed list in place and fails the run at
      # the end, like a refused MDPro4 snapshot.
      - name: Build the fused Rush ban list
        id: rush_lflist
        continue-on-error: true
        run: node scripts/build-rush-lflist.mjs
        env:
          REPORT_PATH: ${{ runner.temp }}/report/build-lflist.json

      - name: Commit if the ban list changed
        if: steps.rush_lflist.outcome == 'success'
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain rush/lflist.conf)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add rush/lflist.conf
            git commit -m "chore(rush): rebuild the fused Rush ban list"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "No ban list changes."
          fi

      # `rush/lflist.conf` is a published client asset, and the client can only
      # see an update through version-manifest.json — raw.githubusercontent.com
      # exposes no CORS-readable validator. Its entry used to be refreshed by
      # repo-assets-manifest.yml, whose `paths:` filter lists this very file;
      # that never fired, because GitHub does not trigger workflows from a push
      # made with GITHUB_TOKEN, which is exactly how the commit above lands. The
      # manifest froze on 2026-08-26 while the file kept moving, so every client
      # held a stale ban list and Settings showed a permanent server divergence.
      # Refresh it here instead: same run, no cross-workflow trigger to rely on.
      #
      # Placed BEFORE the translation pipeline on purpose — those steps talk to
      # a wiki and may fail, and the manifest must not be left describing bytes
      # nobody has until the next successful run.
      - name: Refresh the Rush lflist entry in the version manifest
        # Runs after the ban list commit above so the entry's
        # commitSha/commitDate name the commit that actually carried the bytes.
        run: node scripts/update-repo-assets-manifest.mjs

      - name: Commit if the version manifest changed
        run: |
          if [ -n "$(git status --porcelain version-manifest.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add version-manifest.json
            git commit -m "chore(manifest): refresh repo asset entries"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "No version manifest changes."
          fi

      # The translation pipeline runs on every daily pass, after the mirror
      # commit has already landed: each script is incremental and idempotent
      # (a no-op when nothing changed), and a wiki/network failure here must
      # fail the run loudly without undoing the mirror refresh above.
      - name: Resolve wiki pages for new card ids
        run: node scripts/fetch-rush-code-pages.mjs
        env:
          REPORT_PATH: ${{ runner.temp }}/report/resolve-pages.json

      - name: Fetch translations for new pages
        run: node scripts/fetch-rush-translations.mjs
        env:
          REPORT_PATH: ${{ runner.temp }}/report/fetch-translations.json

      - name: Build unified Rush databases
        run: node scripts/build-rush-cdb.mjs
        env:
          REPORT_PATH: ${{ runner.temp }}/report/build-cdb.json

      - name: Regenerate the alternate-art script stubs for new rows
        # build-rush-cdb.mjs may have admitted new rows into the MDPro4
        # alternate cdb; give them their stubs in the same run.
        run: node scripts/build-rush-alternate-scripts.mjs

      - name: Check the ban list against the built database
        # The published list and the published cdb must agree: a listed card
        # the database lacks is a restriction no deck check can enforce.
        run: node scripts/build-rush-lflist.mjs --verify cdb/rush.cdb.gz

      - name: Update version manifest
        run: node scripts/update-rush-manifest.mjs
        env:
          REPORT_PATH: ${{ runner.temp }}/report/update-manifest.json

      - name: Compose the run report
        # Even a failed pipeline gets its Actions summary — the composer treats
        # absent fragments as missing steps, and the failed step above already
        # preserves the run's failure state.
        if: always()
        run: node scripts/report-rush.mjs "$RUNNER_TEMP/report"
        env:
          OLD_IDS_FILE: ${{ runner.temp }}/old-ids.txt

      - name: Commit if the translated databases changed
        run: |
          # An array, because one of the paths contains a space.
          paths=(rush/pages.json rush/translations.json "rush/RD MDPro4 Alternate.cdb" rush/script cdb/rush.cdb.gz cdb/rush.en.cdb.gz cdb/rush.es.cdb.gz version-manifest.json)
          # The report only exists once a run produced notable events, and
          # `git add` aborts on a pathspec with nothing behind it.
          if [ -f reports/rush.json ]; then paths+=(reports/rush.json); fi
          if [ -n "$(git status --porcelain -- "${paths[@]}")" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- "${paths[@]}"
            git commit -m "chore(rush): refresh translated databases"
            git pull --rebase --autostash origin main || true
            git push
          else
            echo "No translated database changes."
          fi

      - name: Fail the run if the MDPro4 mirror or the ban list was refused
        # Those steps run with continue-on-error so the rest of the pipeline
        # keeps working on the committed copies; this is where their failure
        # becomes the run's.
        if: always() && (steps.mdpro4_clone.outcome == 'failure' || steps.mdpro4_check.outcome == 'failure' || steps.rush_lflist.outcome == 'failure')
        run: |
          echo "MDPro4 clone: ${{ steps.mdpro4_clone.outcome }}"
          echo "MDPro4 check: ${{ steps.mdpro4_check.outcome }}"
          echo "Rush ban list build: ${{ steps.rush_lflist.outcome }}"
          exit 1
